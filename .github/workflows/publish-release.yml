name: Publish Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Stable
        run: make

      - name: Upload to Release (GitHub)
        if: github.server_url == 'https://github.com'
        uses: softprops/action-gh-release@v1
        with:
          files: stackvm.cfg

      - name: Upload to Release (Gitea)
        if: github.server_url != 'https://github.com'
        uses: akkuman/gitea-release-action@v1
        with:
          files:
            stackvm.cfg

